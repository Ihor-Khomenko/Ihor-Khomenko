name: Metrics
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview, PRs and languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ihor-Khomenko
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Kiev
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_languages: yes
          plugin_languages_limit: 8
      - name: Contribution calendar (GitHub greens)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ihor-Khomenko
          base: ""
          config_timezone: Europe/Kiev
          plugin_calendar: yes
          plugin_calendar_limit: 1
      - name: Isometric calendar with weekly stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ihor-Khomenko
          base: ""
          config_timezone: Europe/Kiev
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Coding habits (commits per day, last 2 weeks)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ihor-Khomenko
          base: ""
          config_timezone: Europe/Kiev
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
